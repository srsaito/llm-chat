[project]
name = "llm-chat"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ollama>=0.6.2",
    "llm-chat-core",
]

[tool.uv.sources]
llm-chat-core = { path = "../llm-chat-core", editable = true }

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
